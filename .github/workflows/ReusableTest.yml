name: Reusable test

on:
    workflow_call:
        inputs:
            version:
                required: false
                type: string
                default: "1"
            os:
                required: false
                type: string
                default: ubuntu-latest
            arch:
                required: false
                type: string
                default: x64
            allow_failure:
                required: false
                type: boolean
                default: false
            run_codecov:
                required: false
                type: boolean
                default: false
        secrets:
            codecov_token:
                required: true

jobs:
    test:
        name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
        runs-on: ${{ inputs.os }}
        continue-on-error: ${{ inputs.allow_failure }}

        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ inputs.version }}
                  arch: ${{ inputs.arch }}
            - name: Use Julia cache
              uses: julia-actions/cache@v3
            # Development-only pin: remove after the coordinated core release is
            # registered, then verify ordinary resolution before releasing IO.
            - name: Install proposed ThreeBodyDecays revision
              run: >-
                  julia --project -e 'using Pkg;
                  Pkg.add(PackageSpec(url="https://github.com/mmikhasenko/ThreeBodyDecays.jl",
                  rev="3c0a8291ef3c02a10ca41ce6559f5302c8513e80"))'
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
              with:
                  # Resolve the newest jointly compatible set. Forcing every direct
                  # dependency to its individual maximum conflicts with upstream bounds.
                  force_latest_compatible_version: false
            - uses: julia-actions/julia-processcoverage@v1
              if: ${{ inputs.run_codecov }}
            - uses: codecov/codecov-action@v7
              if: ${{ inputs.run_codecov }}
              with:
                  files: lcov.info
                  token: ${{ secrets.codecov_token }}
